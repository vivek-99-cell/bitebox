<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        .box{
            width: 300px;
            height: 200px;
            margin: 50px auto;
            background: rgb(187, 166, 166);
            border-radius: 10px;
            box-shadow: 0px 2px 3px red;
        }
        /* The box-shadow property in css is used to add ashadow effect around an HTML element
        box-shadow: Horizontal offset Vertical offset Blur radius color; */
    </style>

</head>
<body>
    <div class="box">hello</div>
</body>
</html>
